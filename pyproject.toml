[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-analytics-agent"
version = "0.1.0"
description = "A tool-using agent that answers plain-English questions over a DuckDB database with self-correcting SQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omith Chowdhury" }]
dependencies = [
    "duckdb>=1.0,<2",
    "openai>=1.40,<2",
    "matplotlib>=3.8,<4",
    "pyyaml>=6,<7",
    "pandas>=2,<3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
text2sql = "text2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
