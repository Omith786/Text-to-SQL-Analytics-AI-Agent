  question: Which port has the highest average cargo tonnage per call? Show name and average.
  gold_sql: SELECT p.name, AVG(c.cargo_tonnes) AS avg_cargo FROM port_calls c JOIN ports p ON p.port_id = c.port_id GROUP BY p.name ORDER BY avg_cargo DESC LIMIT 1
  difficulty: hard
