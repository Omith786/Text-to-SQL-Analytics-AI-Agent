- id: h01
  question: Which vessel made the most port calls? Give the vessel name and the number of calls.
  gold_sql: SELECT v.name, COUNT(*) AS calls FROM port_calls c JOIN vessels v ON v.mmsi = c.mmsi GROUP BY v.name ORDER BY calls DESC LIMIT 1
